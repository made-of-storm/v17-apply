<!-- V17: содержимое страницы /apply — квалификационная форма.
     Вставляется в блок «HTML-код» (T123) на странице Apply в Тильде.
     Автовысота по postMessage из формы + запуск анимаций при попадании
     во вьюпорт (форма ждёт {v17Visible:1}).

     SEO: индексировать https://v17.vc/apply, не github.io.
     На форме в github.io стоят noindex + canonical на v17.vc/apply. -->
<div id="v17-apply-page" style="background:#F7F2EF">
  <iframe src="https://made-of-storm.github.io/v17-apply/" title="Apply"
          scrolling="no" style="width:100%;height:1200px;border:0;display:block"></iframe>
</div>
<script>
(function () {
  var box = document.getElementById('v17-apply-page');
  var f = box && box.querySelector('iframe');
  if (!f) return;

  window.addEventListener('message', function (ev) {
    if (!ev.data || ev.source !== f.contentWindow) return;

    /* автовысота: форма шлёт высоту контента postMessage-ом */
    if (ev.data.v17FormHeight) {
      var h = Math.min(Math.max(ev.data.v17FormHeight + 40, 600), 6000);
      if (Math.abs((parseFloat(f.style.height) || 0) - h) > 4) f.style.height = h + 'px';
      if (seen) send();
    }

    /* прокрутка к началу шага: сама форма внутри iframe (scrolling=no, высота
       по контенту) страницу прокрутить не может, поэтому просит нас */
    if (typeof ev.data.v17ScrollTop === 'number') {
      var top = f.getBoundingClientRect().top + (window.pageYOffset || 0) + ev.data.v17ScrollTop;
      window.scrollTo({ top: Math.max(0, top - headerOffset() - 16), behavior: 'smooth' });
      /* подтверждаем форме, что прокрутку взяли на себя — она не будет
         дублировать её фокусом на заголовке */
      try { f.contentWindow.postMessage({ v17ScrollAck: 1 }, '*'); } catch (_) {}
    }
  });

  /* Высота залипающей шапки Тильды, чтобы она не накрыла заголовок шага. */
  function headerOffset() {
    var best = 0;
    document.querySelectorAll('.t-header, header, .t396__artboard').forEach(function (el) {
      var cs = getComputedStyle(el);
      if (cs.position !== 'fixed' && cs.position !== 'sticky') return;
      var r = el.getBoundingClientRect();
      if (r.top <= 1 && r.height > best && r.height < 200) best = r.height;
    });
    return best;
  }

  /* анимации формы — когда доскроллили до неё (на /apply это почти сразу) */
  var seen = false;
  function send() { try { f.contentWindow.postMessage({ v17Visible: 1 }, '*'); } catch (_) {} }
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        seen = true; send(); io.disconnect();
      });
    }, { rootMargin: '0px 0px -10% 0px' });
    io.observe(f);
  } else { seen = true; send(); }
})();
</script>
